name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 매일 한국시간 오전 5:10, 6:10, 7:10, 8:10 (UTC 20, 21, 22, 23)
    # 예약 발행 및 깃허브 액션 큐 지연에 완벽 대응
    - cron: '10 20,21,22,23 * * *'
    # 주일 낮 12:30, 오후 2:00 (주일예배 설교 영상 갱신 UTC 03:30, 05:00)
    - cron: '30 3,5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test YouTube feed recovery
        run: node --test site/scripts/youtube-feed.test.mjs

      - name: Fetch Latest Feeds
        run: |
          cd site
          node scripts/fetch-feeds.mjs

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add site/data/
          git diff --staged --quiet || (git commit -m "Auto-update feeds" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

